<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 230" width="520" height="460">
  <!-- 伊什塔级 Ishtar · 平面剪影 Logo：纯白剪影 + 黑色线条 -->
  <!-- 特征：背部穹顶护罩 / 环形引擎涡轮 / 腹侧无人机吊舱 / 舰首 -->

  <!-- 主剪影：穹顶护罩 + 舰首 + 腹侧吊舱，一体轮廓 -->
  <path fill="#ffffff" stroke="#000000" stroke-width="2" stroke-linejoin="round"
        d="
  M 20 106
  C 30 94 46 84 66 78
  C 90 62 124 52 158 56
  C 192 60 214 74 220 94
  C 224 106 219 116 210 122
  C 215 142 212 172 200 194
  C 192 210 176 216 156 214
  C 136 212 124 204 120 190
  C 116 170 117 146 122 130
  C 104 126 88 122 72 118
  C 52 116 30 114 20 106
  Z" />

  <!-- 环形引擎（巨型环状涡轮）：白底 + 黑色同心环 -->
  <circle cx="152" cy="122" r="30" fill="#ffffff"/>
  <circle cx="152" cy="122" r="27" fill="none" stroke="#000000" stroke-width="2.4"/>
  <circle cx="152" cy="122" r="17" fill="none" stroke="#000000" stroke-width="1.8"/>
  <circle cx="152" cy="122" r="7" fill="#000000"/>

  <!-- 背部穹顶护罩装甲缝线 -->
  <path d="M 62 86 C 92 68 128 60 164 62 C 190 64 208 74 218 90"
        fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 96 74 C 110 70 122 69 132 70"
        fill="none" stroke="#000000" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 舰首驾驶舱舷窗缝线 -->
  <path d="M 42 96 l 12 -4 M 40 104 l 13 -3 M 38 112 l 12 -2"
        fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 背部传感器小点 -->
  <circle cx="178" cy="70" r="1.8" fill="#000000"/>
  <circle cx="188" cy="74" r="1.8" fill="#000000"/>
  <circle cx="198" cy="80" r="1.8" fill="#000000"/>

  <!-- 腹侧吊舱三联无人机模块 -->
  <rect x="132" y="146" width="16" height="14" fill="none" stroke="#000000" stroke-width="1.8"/>
  <rect x="132" y="166" width="16" height="14" fill="none" stroke="#000000" stroke-width="1.8"/>
  <rect x="132" y="186" width="16" height="14" fill="none" stroke="#000000" stroke-width="1.8"/>
  <circle cx="140" cy="153" r="3" fill="#000000"/>
  <circle cx="140" cy="173" r="3" fill="#000000"/>
  <circle cx="140" cy="193" r="3" fill="#000000"/>

  <!-- 吊舱侧缘缝线 -->
  <path d="M 206 140 Q 200 168 192 192"
        fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round"/>
</svg>
