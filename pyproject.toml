[project]
name = "eve-local-alert"
version = "1.0.10"
description = "纯本地、只读截屏、零内存改动的轻量化 EVE 端游红名预警工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "psutil>=5.9.0",
    "PySide6>=6.5.0",
    # Win32 窗口枚举 / 矩形 / 最小化检测；仅 Windows 需要
    "pywin32>=306 ; platform_system == 'Windows'",
]

[project.optional-dependencies]
# 可选：独占全屏下使用 DXGI 桌面复制（仅 Windows）
#   uv sync --extra dxgi
dxgi = ["dxcam>=0.0.5"]

[dependency-groups]
# 开发依赖，uv sync 默认安装；仅装运行依赖用 uv sync --no-dev
dev = ["pytest>=8.0"]

[tool.uv]
# 本项目是应用而非库，不需要把自身作为包安装
package = false
